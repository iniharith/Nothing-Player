name: Generate Nothing Player TikTok Brag

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ai-brag-tiktok.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core curl

      - name: Prepare brag output
        run: |
          mkdir -p brag-output/segments
          cat > brag-output/brag-plan.md <<'EOF'
          # Nothing Player TikTok Brag

          Format: 9:16 vertical, 1080x1920, ~20 seconds
          Tone: polished / app-store, dark Nothing-style, red + white accents
          Voice: off

          ## Storyboard
          0.0–3.2s — Hook: NOTHING PLAYER / Your music player should not feel boring.
          3.2–6.4s — Reveal: YouTube Music. Reimagined.
          6.4–9.6s — Discovery: Search. Discover. Play.
          9.6–12.8s — Playback: Synced lyrics / Offline + Background + Crossfade
          12.8–16.0s — Experience: Liquid Glass UI / Themes that feel yours.
          16.0–20.0s — Outro: Open source. Built for listeners. / github.com/iniharith/Nothing-Player
          EOF

      - name: Download bundled /brag music
        run: |
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/latent-spaces/brag/main/skills/brag/assets/music/happy-beats-business-moves-vol-10-by-ende-dot-app.mp3' \
            -o brag-output/music.mp3

      - name: Render scenes
        shell: bash
        run: |
          set -euo pipefail
          FONT='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          REG='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'

          render_scene() {
            IMG="$1"; OUT="$2"; DUR="$3"; TITLE="$4"; SUB="$5"
            ffmpeg -y -loop 1 -framerate 30 -t "$DUR" -i "$IMG" \
              -filter_complex "[0:v]split=2[bg0][fg0];[bg0]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,gblur=sigma=45,eq=brightness=-0.25:saturation=0.7[bg];[fg0]scale=820:1500:force_original_aspect_ratio=decrease[fg];[bg][fg]overlay=(W-w)/2:(H-h)/2+65[base];[base]drawbox=x=0:y=0:w=1080:h=300:color=black@0.72:t=fill,drawbox=x=0:y=1680:w=1080:h=240:color=black@0.72:t=fill,drawbox=x=64:y=82:w=18:h=118:color=0xE3262E@1:t=fill,drawtext=fontfile=${FONT}:text='${TITLE}':fontcolor=white:fontsize=72:x=110:y=78,drawtext=fontfile=${REG}:text='${SUB}':fontcolor=0xE8E8E8:fontsize=36:x=110:y=175,drawtext=fontfile=${REG}:text='NOTHING PLAYER':fontcolor=white@0.9:fontsize=30:x=70:y=1780,drawtext=fontfile=${REG}:text='OPEN SOURCE MUSIC CLIENT':fontcolor=0xE3262E:fontsize=26:x=70:y=1830,fps=30,format=yuv420p[v]" \
              -map '[v]' -an -c:v libx264 -preset medium -crf 18 -movflags +faststart "$OUT"
          }

          render_scene asset/screenshot/01.png brag-output/segments/01.mp4 3.2 'NOTHING PLAYER' 'Your music player should not feel boring.'
          render_scene asset/screenshot/02.png brag-output/segments/02.mp4 3.2 'YOUTUBE MUSIC.' 'REIMAGINED.'
          render_scene asset/screenshot/03.png brag-output/segments/03.mp4 3.2 'SEARCH. DISCOVER.' 'PLAY.'
          render_scene asset/screenshot/04.png brag-output/segments/04.mp4 3.2 'SYNCED LYRICS' 'Offline + Background + Crossfade'
          render_scene asset/screenshot/05.png brag-output/segments/05.mp4 3.2 'LIQUID GLASS UI' 'Themes that feel yours.'
          render_scene asset/screenshot/06.png brag-output/segments/06.mp4 4.0 'OPEN SOURCE.' 'Built for listeners.'

          cat > brag-output/segments.txt <<'EOF'
          file 'segments/01.mp4'
          file 'segments/02.mp4'
          file 'segments/03.mp4'
          file 'segments/04.mp4'
          file 'segments/05.mp4'
          file 'segments/06.mp4'
          EOF

          ffmpeg -y -f concat -safe 0 -i brag-output/segments.txt -c copy brag-output/video-silent.mp4

      - name: Add music and final TikTok outro
        run: |
          ffmpeg -y -i brag-output/video-silent.mp4 -stream_loop -1 -i brag-output/music.mp3 \
            -filter_complex "[1:a]atrim=0:20,afade=t=in:st=0:d=0.35,afade=t=out:st=18.5:d=1.5,volume=0.42[a]" \
            -map 0:v -map '[a]' -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart brag-output/brag.mp4

      - name: Create poster frame
        run: |
          ffmpeg -y -ss 1.2 -i brag-output/brag.mp4 -frames:v 1 -q:v 2 brag-output/brag.jpg

      - name: Write TikTok share copy
        run: |
          cat > brag-output/share-copy.txt <<'EOF'
          Your music player should not feel boring. 🎧

          Nothing Player is an open-source YouTube Music client built with Kotlin + Compose Multiplatform, with synced lyrics, offline/background playback, crossfade, themes and more.

          GitHub: github.com/iniharith/Nothing-Player

          #NothingPlayer #OpenSource #Android #Kotlin #ComposeMultiplatform #YouTubeMusic #MusicPlayer #FOSS #TechTok
          EOF

      - name: Upload TikTok video package
        uses: actions/upload-artifact@v4
        with:
          name: nothing-player-tiktok-brag
          path: |
            brag-output/brag.mp4
            brag-output/brag.jpg
            brag-output/brag-plan.md
            brag-output/share-copy.txt
          retention-days: 14
